<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="30%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Bomb Body Gradient -->
    <linearGradient id="bombMetal" x1="20%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#24344d"/>
      <stop offset="45%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#0b101c"/>
    </linearGradient>

    <!-- Letter L and Title Gradients -->
    <linearGradient id="cyanPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Spark Fire Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.45"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
  </style>

  <!-- Base Rounded Container -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Dot Grid Background -->
  <rect width="1200" height="360" rx="16" fill="url(#dotGrid)"/>

  <!-- Radial Atmosphere Glows -->
  <circle cx="200" cy="180" r="300" fill="url(#cyanGlow)"/>
  <circle cx="340" cy="70" r="220" fill="url(#amberGlow)"/>
  <circle cx="1020" cy="200" r="260" fill="url(#purpleGlow)"/>

  <!-- Cyber Grid Lines (Decorative Bottom/Side) -->
  <path d="M0 320 H1200 M0 280 H1200" stroke="#1e293b" stroke-width="1" opacity="0.25"/>
  <path d="M280 0 V360 M920 0 V360" stroke="#1e293b" stroke-width="1" opacity="0.15"/>

  <!-- ================= BOMB ICON GRAPHIC (LEFT) ================= -->
  <g transform="translate(45, 0)">
    <!-- Fuse Neck / Collar -->
    <rect x="145" y="66" width="34" height="18" rx="5" fill="#334155" stroke="#00b4d8" stroke-width="2.5" transform="rotate(28 145 66)"/>

    <!-- Fuse Cord -->
    <path d="M172 65 C185 45, 205 50, 222 28" fill="none" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Spark Fire Burst -->
    <g transform="translate(222, 28)">
      <!-- Outer Flame Glow -->
      <circle cx="0" cy="0" r="24" fill="#f59e0b" opacity="0.25"/>
      <path d="M0 -18 L4 -5 L18 -1 L6 6 L8 19 L-2 9 L-13 15 L-7 3 L-18 -5 L-4 -6 Z" fill="url(#sparkGrad)"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>

    <!-- Bomb Sphere Shadow / Outer Ring -->
    <circle cx="130" cy="200" r="88" fill="none" stroke="#00b4d8" stroke-width="3.5" opacity="0.85"/>
    <circle cx="130" cy="200" r="86" fill="url(#bombMetal)"/>

    <!-- Bomb Body Highlight Reflex -->
    <path d="M75 165 A 68 68 0 0 1 165 130" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Glowing "L" Shape inside Bomb -->
    <path d="M108 165 V225 H156" fill="none" stroke="url(#cyanPulse)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M108 165 V225 H156" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>

  <!-- ================= CENTER HERO CONTENT ================= -->
  <!-- Tagline Badge -->
  <g transform="translate(325, 68)">
    <rect x="0" y="0" width="224" height="26" rx="13" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="4" fill="#38bdf8"/>
    <text x="26" y="17" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.2" class="font-sans">MULTIPLAYER WORD BOMB</text>
  </g>

  <!-- Title: LETTERFALL -->
  <text x="325" y="152" fill="url(#titleGrad)" font-size="64" font-weight="900" letter-spacing="3.5" class="font-sans">LETTERFALL</text>

  <!-- Subtitle -->
  <text x="327" y="196" fill="#94a3b8" font-size="19" font-weight="400" class="font-sans">
    The fast-paced arcade showdown. Type the word. Pass the bomb. Survive.
  </text>

  <!-- Feature Highlights Chips Row -->
  <g transform="translate(327, 235)">
    <!-- Chip 1: Real-time -->
    <g transform="translate(0, 0)">
      <rect width="138" height="38" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="18" cy="19" r="4" fill="#22c55e"/>
      <text x="32" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">Real-Time IO</text>
    </g>

    <!-- Chip 2: Word Bomb -->
    <g transform="translate(150, 0)">
      <rect width="138" height="38" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1.2"/>
      <path d="M14 23 L18 15 M22 17 L16 23" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">Word Bomb</text>
    </g>

    <!-- Chip 3: 5 Languages -->
    <g transform="translate(300, 0)">
      <rect width="144" height="38" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="18" cy="19" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M12 19 H24 M18 13 C20 16 20 22 18 25 M18 13 C16 16 16 22 18 25" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="32" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">5 Languages</text>
    </g>

    <!-- Chip 4: Ranked & Clans -->
    <g transform="translate(456, 0)">
      <rect width="146" height="38" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1.2"/>
      <path d="M13 23 L15 15 L18 18 L21 15 L23 23 Z" fill="none" stroke="#a855f7" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="32" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">Clans &amp; Ladder</text>
    </g>
  </g>

  <!-- ================= RIGHT DECORATIVE SYLLABLE TILES ================= -->
  <!-- Floating Keycap 1: "BOM" -->
  <g transform="translate(980, 75) rotate(-6)">
    <rect width="96" height="60" rx="10" fill="#0f172a" stroke="#00b4d8" stroke-width="1.6"/>
    <text x="48" y="38" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="2" class="font-mono">BOM</text>
    <text x="48" y="52" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="font-sans">SYLLABLE</text>
  </g>

  <!-- Floating Keycap 2: "FALL" -->
  <g transform="translate(1040, 165) rotate(4)">
    <rect width="102" height="60" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="51" y="38" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="2" class="font-mono">FALL</text>
    <text x="51" y="52" fill="#f59e0b" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="font-sans">LETTER</text>
  </g>

  <!-- Floating Keycap 3: "WIN" -->
  <g transform="translate(960, 248) rotate(-3)">
    <rect width="90" height="54" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.6"/>
    <text x="45" y="34" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="2" class="font-mono">WIN</text>
    <text x="45" y="47" fill="#22c55e" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="font-sans">STREAK</text>
  </g>
</svg>
